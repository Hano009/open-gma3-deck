name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: ma3
    attributes:
      label: grandMA3 version and type
      placeholder: "2.4.2.2 onPC on Windows / grandMA3 light"
    validations:
      required: true
  - type: input
    id: deck
    attributes:
      label: Stream Deck model and app version
      placeholder: "Stream Deck + XL, Stream Deck 7.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the command shown in the grandMA3 command line history if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Plugin log
      description: From org.open-gma3-deck.sdPlugin/logs/ in the Stream Deck plugins folder.
      render: text
